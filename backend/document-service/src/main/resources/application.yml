spring:
  application:
    name: document-service
  config:
    import: classpath:common.yml
  flyway:
    schemas: document
    default-schema: document
  jpa:
    properties:
      hibernate:
        default_schema: document
  servlet:
    multipart:
      max-file-size: 26MB
      max-request-size: 30MB

server:
  port: ${PORT:8087}

# API description is served under /public/ so the gateway's Swagger UI can read it without a token.
springdoc:
  api-docs:
    path: /api/documents/public/v3/api-docs
