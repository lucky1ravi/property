spring:
  application:
    name: billing-service
  config:
    import: classpath:common.yml
  flyway:
    schemas: billing
    default-schema: billing
  jpa:
    properties:
      hibernate:
        default_schema: billing

server:
  port: ${PORT:8083}

# API description is served under /public/ so the gateway's Swagger UI can read it without a token.
springdoc:
  api-docs:
    path: /api/billing/public/v3/api-docs
