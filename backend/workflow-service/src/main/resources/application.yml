spring:
  application:
    name: workflow-service
  config:
    import: classpath:common.yml
  flyway:
    schemas: workflow
    default-schema: workflow
  jpa:
    properties:
      hibernate:
        default_schema: workflow

server:
  port: ${PORT:8085}

# API description is served under /public/ so the gateway's Swagger UI can read it without a token.
springdoc:
  api-docs:
    path: /api/workflow/public/v3/api-docs

propertyos:
  email:
    # none = only log (local runs), ses = Amazon SES (needs EMAIL_FROM, a verified sender).
    provider: ${EMAIL_PROVIDER:none}
    from: ${EMAIL_FROM:}
    # Region of the verified sender. Empty = the AWS_REGION of the process.
    region: ${EMAIL_REGION:}
    # For now every email goes to this one address instead of its real recipient. Set EMAIL_OVERRIDE_TO to a space to send to the real recipients.
    override-to: ${EMAIL_OVERRIDE_TO:ravindra.nalawade56@gmail.com}
