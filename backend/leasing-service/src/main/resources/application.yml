spring:
  application:
    name: leasing-service
  config:
    import: classpath:common.yml
  flyway:
    schemas: leasing
    default-schema: leasing
  jpa:
    properties:
      hibernate:
        default_schema: leasing

server:
  port: ${PORT:8082}

# API description is served under /public/ so the gateway's Swagger UI can read it without a token.
springdoc:
  api-docs:
    path: /api/leasing/public/v3/api-docs
