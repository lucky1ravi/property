spring:
  application:
    name: maintenance-service
  config:
    import: classpath:common.yml
  flyway:
    schemas: maintenance
    default-schema: maintenance
  jpa:
    properties:
      hibernate:
        default_schema: maintenance

server:
  port: ${PORT:8084}

# API description is served under /public/ so the gateway's Swagger UI can read it without a token.
springdoc:
  api-docs:
    path: /api/maintenance/public/v3/api-docs
