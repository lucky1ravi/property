spring:
  application:
    name: ai-service
  config:
    import: classpath:common.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    schemas: ai
    default-schema: ai
  jpa:
    properties:
      hibernate:
        default_schema: ai

server:
  port: ${PORT:8086}

# API description is served under /public/ so the gateway's Swagger UI can read it without a token.
springdoc:
  api-docs:
    path: /api/ai/public/v3/api-docs
