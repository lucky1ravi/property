spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: api-gateway
  main:
    web-application-type: reactive

server:
  port: ${PORT:8080}
  shutdown: graceful

propertyos.resilience:
  open-seconds: ${RESILIENCE_OPEN_SECONDS:20}

propertyos:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
  allowed-origins: ${ALLOWED_ORIGINS:*}
  rate-limit:
    user-per-minute: ${RATE_LIMIT_USER_PER_MINUTE:600}
    public-per-minute: ${RATE_LIMIT_PUBLIC_PER_MINUTE:120}
  services:
    identity: ${IDENTITY_URL:http://localhost:8081}
    leasing: ${LEASING_URL:http://localhost:8082}
    billing: ${BILLING_URL:http://localhost:8083}
    maintenance: ${MAINTENANCE_URL:http://localhost:8084}
    workflow: ${WORKFLOW_URL:http://localhost:8085}
    ai: ${AI_URL:http://localhost:8086}
    documents: ${DOCUMENTS_URL:http://localhost:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: api-gateway

spring.cloud.gateway.httpclient:
  connect-timeout: 5000
  response-timeout: 90s

# One Swagger UI for the whole platform at /swagger-ui.html. Turn off in production with API_DOCS_ENABLED=false.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: Identity
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - { name: Identity, url: /api/identity/public/v3/api-docs }
      - { name: Leasing, url: /api/leasing/public/v3/api-docs }
      - { name: Billing, url: /api/billing/public/v3/api-docs }
      - { name: Maintenance, url: /api/maintenance/public/v3/api-docs }
      - { name: Workflow, url: /api/workflow/public/v3/api-docs }
      - { name: AI, url: /api/ai/public/v3/api-docs }
      - { name: Documents, url: /api/documents/public/v3/api-docs }
