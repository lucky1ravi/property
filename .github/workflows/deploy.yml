name: Deploy to AWS

# Continuous delivery. Every push to develop deploys ONLY what changed since it was last deployed:
#   - each changed backend service is tested, packaged into its own small image, and rolled out on its own
#     (identity first, then the other services, the gateway last);
#   - each changed frontend app is built and uploaded on its own, and only its files are invalidated in CloudFront.
# A change to shared code (platform-common, the shared UI package) rebuilds everything that depends on it.
# "Last deployed" is the git tag deployed/<unit>, moved after every successful rollout.
# Needs the repository variables printed by `terraform output github_variables` (see docs/CI-CD.md).
on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      everything:
        description: Rebuild and deploy every service and app, even if unchanged
        type: boolean
        default: false

# One deployment at a time. A newer push waits, and works out what changed since the last SUCCESSFUL deployment,
# so nothing is skipped when runs queue up.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write # OIDC to AWS, no stored keys
  contents: write # moves the deployed/<unit> tags

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  changes:
    name: What changed since the last deploy
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.c.outputs.backend }}
      identity: ${{ steps.c.outputs.identity }}
      workers: ${{ steps.c.outputs.workers }}
      gateway: ${{ steps.c.outputs.gateway }}
      frontend: ${{ steps.c.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the deployed/* tags and the history between them
      - id: c
        run: |
          if [ "${{ inputs.everything }}" = "true" ]; then mode=all; else mode=deployed; fi
          bash .github/scripts/changes.sh "$mode"
      - name: Summary
        run: |
          {
            echo "### Deploying"
            echo "- Backend: \`${{ steps.c.outputs.backend }}\`"
            echo "- Frontend: \`${{ steps.c.outputs.frontend }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- backend: test, package and publish each changed service in parallel ----------
  build:
    name: Build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.backend != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.backend) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IT_JDBC_URL: jdbc:postgresql://localhost:5432/postgres
      IT_DB_USER: postgres
      IT_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package this service (and the shared code it uses)
        working-directory: backend
        run: mvn -B -ntp -pl "${{ matrix.service }}" -am verify
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the image
        run: |
          ctx=$(mktemp -d)
          cp "backend/${{ matrix.service }}/target/app.jar" "$ctx/app.jar"
          cp backend/docker-entrypoint.sh "$ctx/"
          image="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ matrix.service }}-${GITHUB_SHA}"
          docker build -f backend/Dockerfile.service --build-arg SERVICE="${{ matrix.service }}" -t "$image" "$ctx"
          docker push "$image"
      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          path: backend/**/target/*-reports/

  # ---------- backend: roll out in dependency order ----------
  deploy-identity:
    name: Roll out identity-service
    needs: [changes, build]
    if: needs.changes.outputs.identity == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/roll-out
        with:
          service: identity-service
          role: ${{ vars.AWS_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          cluster: ${{ vars.ECS_CLUSTER }}
          repository: ${{ vars.ECR_REPOSITORY }}

  deploy-workers:
    name: Roll out ${{ matrix.service }}
    needs: [changes, build, deploy-identity]
    if: >-
      always() && needs.changes.outputs.workers != '[]' && needs.build.result == 'success' &&
      (needs.deploy-identity.result == 'success' || needs.deploy-identity.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.workers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/roll-out
        with:
          service: ${{ matrix.service }}
          role: ${{ vars.AWS_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          cluster: ${{ vars.ECS_CLUSTER }}
          repository: ${{ vars.ECR_REPOSITORY }}

  deploy-gateway:
    name: Roll out api-gateway
    needs: [changes, build, deploy-identity, deploy-workers]
    if: >-
      always() && needs.changes.outputs.gateway == 'true' && needs.build.result == 'success' &&
      (needs.deploy-identity.result == 'success' || needs.deploy-identity.result == 'skipped') &&
      (needs.deploy-workers.result == 'success' || needs.deploy-workers.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/roll-out
        with:
          service: api-gateway
          role: ${{ vars.AWS_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          cluster: ${{ vars.ECS_CLUSTER }}
          repository: ${{ vars.ECR_REPOSITORY }}

  # ---------- frontend: build and publish only the apps that changed ----------
  frontend:
    name: Frontend (${{ needs.changes.outputs.frontend }})
    needs: [changes, build, deploy-identity, deploy-workers, deploy-gateway]
    if: >-
      always() && needs.changes.outputs.frontend != '[]' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test
        working-directory: frontend
        run: |
          npm ci
          npm test
      - name: Build the apps that changed
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.APP_URL }}
          APPS: ${{ needs.changes.outputs.frontend }}
        run: |
          for app in $(echo "$APPS" | jq -r '.[]'); do
            echo "::group::build $app"
            npm run build -w "@propertyos/$app"
            echo "::endgroup::"
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload each changed app
        env:
          APPS: ${{ needs.changes.outputs.frontend }}
          BUCKET: s3://${{ vars.FRONTEND_BUCKET }}
        run: |
          paths=()
          for app in $(echo "$APPS" | jq -r '.[]'); do
            if [ "$app" = shell ]; then
              dir=frontend/apps/shell/dist; dest="$BUCKET"; extra=(--exclude "remotes/*"); paths+=("/index.html" "/favicon*")
            else
              dir="frontend/apps/$app/dist"; dest="$BUCKET/remotes/$app"; extra=(); paths+=("/remotes/$app/*")
            fi
            # Hashed files never change, so they are cached for a year. index.html and remoteEntry.js keep their
            # names between releases, so browsers must re-check them.
            aws s3 sync "$dir" "$dest" --delete "${extra[@]}" --exclude "assets/*" --cache-control "no-cache"
            aws s3 sync "$dir/assets" "$dest/assets" --exclude "remoteEntry*.js" --cache-control "public, max-age=31536000, immutable"
            if [ -f "$dir/assets/remoteEntry.js" ]; then
              aws s3 cp "$dir/assets/remoteEntry.js" "$dest/assets/remoteEntry.js" --cache-control "no-cache" --content-type "application/javascript"
            fi
          done
          echo "paths=${paths[*]}" >> "$GITHUB_ENV"
      - name: Refresh CloudFront for those files only
        run: |
          set -f # the paths contain * and must reach CloudFront as written
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths $paths
      - name: Record what is deployed
        env:
          APPS: ${{ needs.changes.outputs.frontend }}
        run: |
          for app in $(echo "$APPS" | jq -r '.[]'); do
            git tag -f "deployed/$app" "$GITHUB_SHA"
            git push -f origin "refs/tags/deployed/$app"
          done

  smoke:
    name: Smoke check through CloudFront
    needs: [changes, deploy-identity, deploy-workers, deploy-gateway, frontend]
    if: >-
      always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.backend != '[]' || needs.changes.outputs.frontend != '[]')
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}/api/identity/public/options" || true)
            app=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}/" || true)
            [ "$code" = 200 ] && [ "$app" = 200 ] && { echo "API and website answered 200"; exit 0; }
            echo "attempt $i: API $code, website $app"; sleep 10
          done
          echo "The site did not answer 200 in time"; exit 1
